name: Publish to crates.io

# Manual only, and defaults to a dry run. Publishing is irreversible: crates.io never
# deletes a version, and yanking only hides it from resolution — the source stays
# downloadable. So a real upload has to be asked for twice (untick dry-run AND type the
# version).
#
# NOTE: this workflow used to scan the staged package against a LEAK_PATTERN secret
# before uploading. That step was removed on request. Nothing now checks the package for
# internal identifiers, and a crates.io version can never be withdrawn — yanking only
# hides it from resolution, the source stays downloadable. Scan by hand before a real
# upload:
#
#   cargo package --locked
#   grep -rliE '<pattern>' target/package/<name>-<version>

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — package and verify, upload nothing
        type: boolean
        default: true
      confirm_version:
        description: To publish for real, untick dry-run AND type the version here (e.g. 0.1.0)
        type: string
        default: ''

permissions:
  contents: read
  # Lets the job mint the OIDC assertion that crates.io exchanges for a short-lived
  # publish token. Required by Trusted Publishing.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve name and version
        id: v
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0] | "name=\(.name)", "version=\(.version)"' >> "$GITHUB_OUTPUT"

      # Builds target/package/<name>-<version>/ — the exact tree that gets uploaded.
      - name: Package and verify
        run: |
          cargo package --locked
          cargo package --list --locked

      - name: Stop here on a dry run
        if: ${{ inputs.dry_run }}
        run: echo "Dry run — packaged, verified, and the crates.io trust checked below. Nothing uploaded."

      - name: Confirm the real upload
        if: ${{ !inputs.dry_run }}
        env:
          CONFIRM: ${{ inputs.confirm_version }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ "$CONFIRM" != "$VERSION" ]; then
            echo "::error::confirm_version was '$CONFIRM' but the manifest says '$VERSION'. Refusing to publish."
            exit 1
          fi

      # Trusted Publishing. Exchanges this run's OIDC identity for a crates.io token that
      # lasts minutes and is only valid from this workflow, so no long-lived credential
      # sits in the repo. Nothing to configure here beyond `id-token: write` above — the
      # trust is registered on the crates.io side, against:
      #
      #   repository:        salim-bt/openwallet-purge
      #   workflow filename: publish-crate.yml
      #
      # If that registration is missing or the values do not match, this step fails and
      # nothing is uploaded.
      #
      # Deliberately NOT gated on dry_run. Minting is read-only — it proves the trust
      # relationship without publishing anything — so a dry run exercises the auth path
      # too and a green dry run means the next real upload will authenticate. Gating it
      # would leave the credential path untested until the irreversible step. The token
      # is scoped to this run and expires in minutes; on a dry run it simply goes unused.
      - name: Mint a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify
